<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điều Khiển Quản Trị - CLB Robotics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        .sidebar { width: 256px; }
        .min-w-100 { min-width: 100px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="flex">
        
        <aside class="sidebar bg-gray-800 text-white flex-shrink-0 min-h-screen p-4 transition-all duration-300">
            <h1 class="text-2xl font-bold mb-8 text-center">Admin Panel</h1>
            <nav>
                <ul>
                    <li class="mb-4">
                        <a href="admin.html" class="flex items-center p-3 rounded-lg bg-gray-700 hover:bg-gray-600">
                            <i class="fas fa-tachometer-alt mr-3"></i> Dashboard
                        </a>
                    </li>
                    <li class="mb-4">
                        <button id="logout-btn" class="w-full flex items-center p-3 rounded-lg hover:bg-red-600 bg-red-500 transition-colors duration-200">
                            <i class="fas fa-sign-out-alt mr-3"></i> Đăng Xuất
                        </button>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="flex-grow p-6">
            <h2 class="text-3xl font-semibold text-gray-800 mb-6">Bảng Điều Khiển Quản Trị</h2>
            <p class="text-gray-600 mb-8">Xin chào, Giáo Viên Hướng Dẫn, Hãy kiểm tra các thông báo mới.</p>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                
                <div class="bg-white p-6 rounded-xl shadow-lg flex justify-between items-center">
                    <div>
                        <p class="text-sm font-medium text-gray-500">Thành viên</p>
                        <p id="member-count" class="text-3xl font-bold text-gray-900">0</p>
                    </div>
                    <i class="fas fa-users text-4xl text-blue-500"></i>
                </div>
                
                <div class="bg-white p-6 rounded-xl shadow-lg flex justify-between items-center">
                    <div>
                        <p class="text-sm font-medium text-gray-500">Đơn ĐK Mới</p>
                        <p id="registration-count" class="text-3xl font-bold text-gray-900">0</p>
                    </div>
                    <i class="fas fa-paper-plane text-4xl text-green-500"></i>
                </div>
                
                <div class="bg-white p-6 rounded-xl shadow-lg flex justify-between items-center">
                    <div>
                        <p class="text-sm font-medium text-gray-500">Tổng số Dự án</p>
                        <p id="project-count" class="text-3xl font-bold text-gray-900">0</p>
                    </div>
                    <i class="fas fa-tools text-4xl text-yellow-500"></i>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-lg flex justify-between items-center">
                    <div>
                        <p class="text-sm font-medium text-gray-500">Sự kiện Sắp tới</p>
                        <p id="event-count" class="text-3xl font-bold text-gray-900">0</p>
                    </div>
                    <i class="fas fa-bell text-4xl text-red-500"></i>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-lg">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">Đơn Đăng Ký Chờ Phê Duyệt</h3>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider min-w-100">ID</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider min-w-100">HỌ TÊN</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider min-w-100">LỚP</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider min-w-100">EMAIL</th>
                                <th scope="col" class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider min-w-100">HÀNH ĐỘNG</th>
                            </tr>
                        </thead>
                        <tbody id="registration-table-body" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="5" class="text-center py-4 text-gray-500">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ====================================================
        // 1. HÀM TẢI VÀ HIỂN THỊ CHỈ SỐ DASHBOARD
        // ====================================================
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                if (!response.ok) { throw new Error('Không thể tải chỉ số dashboard'); }
                const result = await response.json();
                
                if (result.success) {
                    const stats = result.stats;
                    
                    document.getElementById('member-count').textContent = stats.memberCount;
                    document.getElementById('registration-count').textContent = stats.newRegistrationCount;
                    document.getElementById('project-count').textContent = stats.totalProjectCount;
                    document.getElementById('event-count').textContent = stats.upcomingEventCount;
                }
            } catch (error) {
                console.error('Lỗi khi tải chỉ số:', error);
            }
        }

        // ====================================================
        // 2. HÀM TẢI DANH SÁCH ĐĂNG KÝ
        // ====================================================
        async function loadRegistrations() {
            const tableBody = document.getElementById('registration-table-body');
            tableBody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-gray-500">Đang tải...</td></tr>';
            
            try {
                const response = await fetch('/api/registrations');
                const data = await response.json();
                
                tableBody.innerHTML = ''; 
                
                if (data.success && data.data.length > 0) {
                    data.data.forEach(reg => {
                        const row = tableBody.insertRow();
                        row.className = 'border-b hover:bg-gray-50';
                        
                        row.insertCell().textContent = reg.id;
                        row.insertCell().textContent = reg.name;
                        row.insertCell().textContent = reg.class;
                        row.insertCell().textContent = reg.email;
                        
                        const actionsCell = row.insertCell();
                        actionsCell.className = 'flex space-x-2 p-3 justify-center';
                        
                        // Nút Phê duyệt
                        const approveBtn = document.createElement('button');
                        approveBtn.textContent = 'Phê duyệt';
                        approveBtn.className = 'bg-green-500 text-white px-3 py-1 rounded text-xs font-semibold hover:bg-green-600 transition-colors';
                        approveBtn.onclick = () => handleAction(reg.id, 'approve', reg.name);
                        
                        // Nút Từ chối
                        const rejectBtn = document.createElement('button');
                        rejectBtn.textContent = 'Từ chối';
                        rejectBtn.className = 'bg-red-500 text-white px-3 py-1 rounded text-xs font-semibold hover:bg-red-600 transition-colors';
                        rejectBtn.onclick = () => handleAction(reg.id, 'reject', reg.name);
                        
                        actionsCell.appendChild(approveBtn);
                        actionsCell.appendChild(rejectBtn);
                    });
                } else {
                    tableBody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-gray-500">Không có đơn đăng ký mới nào.</td></tr>';
                }
            } catch (error) {
                console.error('Lỗi khi tải danh sách:', error);
                tableBody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-red-500">Lỗi: Không thể kết nối Server.</td></tr>';
            }
        }

        // ====================================================
        // 3. HÀM XỬ LÝ HÀNH ĐỘNG (PHÊ DUYỆT/TỪ CHỐI)
        // ====================================================
        async function handleAction(id, action, name) {
            if (!confirm(`Bạn có chắc chắn muốn ${action === 'approve' ? 'PHÊ DUYỆT' : 'TỪ CHỐI'} đơn đăng ký của ${name} không?`)) {
                return;
            }

            try {
                const response = await fetch('/api/registrations/approve-reject', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, action })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    alert(result.message);
                    
                    // CẬP NHẬT TỰ ĐỘNG CÁC CHỈ SỐ VÀ DANH SÁCH
                    loadRegistrations(); 
                    loadStats(); 

                } else {
                    alert(result.message || 'Có lỗi xảy ra khi xử lý hành động.');
                }
            } catch (error) {
                console.error(`Lỗi xử lý ${action}:`, error);
                alert(`Lỗi: Không thể kết nối Server để xử lý ${action}.`);
            }
        }

        // ====================================================
        // 4. CHỨC NĂNG LOGOUT
        // ====================================================
        document.getElementById('logout-btn').addEventListener('click', () => {
            window.location.href = 'login.html'; 
        });


        // ====================================================
        // 5. GỌI HÀM KHI TRANG TẢI XONG (KHỞI TẠO)
        // ====================================================
        document.addEventListener('DOMContentLoaded', () => {
            loadStats(); 
            loadRegistrations(); 
        });
    </script>
    <script>
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        const userRole = localStorage.getItem('userRole');

        // Yêu cầu: Đã đăng nhập VÀ vai trò là 'admin'
        if (isLoggedIn !== 'true' || userRole !== 'admin') {
        // Nếu không hợp lệ, chuyển hướng về trang đăng nhập
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userRole');
            alert('Bạn cần đăng nhập với tài khoản Quản trị để truy cập trang này.');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
