<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - CLB Robotics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-blue-600 border-b pb-4 mb-6">Hồ sơ Cá nhân</h1>
        
        <a href="members.html" class="text-sm text-gray-500 hover:text-blue-500 mb-4 inline-block">
            <i class="fas fa-arrow-left mr-2"></i> Quay lại Bảng điều khiển
        </a>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="col-span-1 flex flex-col items-center">
                <img src="https://via.placeholder.com/150" alt="Ảnh đại diện" class="w-32 h-32 rounded-full border-4 border-blue-500 shadow-md">
                <h2 class="text-xl font-semibold mt-4">Nguyễn Thanh Tùng</h2>
                <p class="text-gray-500">Thành viên - Lớp 11A3</p>
                <button class="mt-4 bg-gray-200 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-300">Cập nhật ảnh</button>
            </div>

            <div class="col-span-2 space-y-4">
                <div class="border-b pb-2">
                    <p class="text-sm text-gray-500">Tên đăng nhập / ID</p>
                    <p class="text-lg font-medium">tungnt</p>
                </div>
                <div class="border-b pb-2">
                    <p class="text-sm text-gray-500">Lớp</p>
                    <p class="text-lg font-medium">11A3 (Niên khóa 2025-2026)</p>
                </div>
                <div class="border-b pb-2">
                    <p class="text-sm text-gray-500">Email liên hệ</p>
                    <p class="text-lg font-medium">tungnt@school.edu.vn</p>
                </div>
                <div class="border-b pb-2">
                    <p class="text-sm text-gray-500">Ngày tham gia CLB</p>
                    <p class="text-lg font-medium">01/09/2025</p>
                </div>
                <div class="border-b pb-2">
                    <p class="text-sm text-gray-500">Lĩnh vực quan tâm</p>
                    <p class="text-lg font-medium">Lập trình Vi điều khiển, Thiết kế Robot 3D</p>
                </div>
                
                <button class="mt-4 bg-green-500 text-white py-2 px-4 rounded-lg hover:bg-green-600">Cập nhật Thông tin</button>
            </div>
        </div>
    </div>
</body>
</html>
