<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - CLB Robotics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
        <h2 class="text-3xl font-bold text-gray-800 text-center mb-6">Đăng Nhập Quản Trị</h2>
        
        <form id="login-form">
            
            <div class="mb-4">
                <label for="username" class="block text-gray-700 text-sm font-medium mb-2">Tên đăng nhập</label>
                <div class="flex items-center border border-gray-300 rounded-lg shadow-sm focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500">
                    <span class="p-3 text-gray-400"><i class="fas fa-user"></i></span>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Nhập tên đăng nhập" 
                        required 
                        class="w-full p-2.5 outline-none bg-transparent"
                    >
                </div>
            </div>

            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-medium mb-2">Mật khẩu</label>
                <div class="flex items-center border border-gray-300 rounded-lg shadow-sm focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500">
                    <span class="p-3 text-gray-400"><i class="fas fa-lock"></i></span>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Nhập mật khẩu" 
                        required 
                        class="w-full p-2.5 outline-none bg-transparent"
                    >
                </div>
            </div>

            <button 
                type="submit" 
                class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            >
                Đăng Nhập
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <a href="index.html" class="text-blue-500 hover:text-blue-700 text-sm">Quay lại trang chủ</a>
        </div>

    </div>

    <script>
        // =======================================================
        // HÀM XỬ LÝ ĐĂNG NHẬP
        // =======================================================
        async function handleLogin(e) {
            e.preventDefault(); // Ngăn form submit theo cách truyền thống

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                // Gửi request POST đến API đăng nhập
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                // Kiểm tra lỗi mạng hoặc lỗi Server (ví dụ: 401, 500)
                if (!response.ok) {
                     // Nếu Server trả về status code lỗi (ví dụ 401 Unauthorized)
                    const errorResult = await response.json();
                    alert(errorResult.message || `Đăng nhập thất bại (Lỗi: ${response.status})`);
                    return;
                }
                
                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userRole', result.role); // Lưu lại vai trò
                    // CHUYỂN HƯỚNG ĐÚNG ĐẮN ĐỂ KHẮC PHỤC LỖI /undefined
                    if (result.role === 'admin') {
                        // Chuyển hướng đến bảng Admin
                        window.location.href = 'admin.html'; 
                    } else {
                        // Chuyển hướng đến bảng người dùng thông thường (nếu có)
                        window.location.href = 'members.html'; 
                    }
                } else {
                    alert(result.message || 'Tên đăng nhập hoặc mật khẩu không đúng.');
                }
            } catch (error) {
                console.error('Lỗi đăng nhập:', error);
                alert('Không thể kết nối Server để đăng nhập. Vui lòng kiểm tra Server.');
            }
        }

        // Gắn sự kiện submit vào form khi trang tải xong
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', handleLogin);
            }
        });
    </script>
</body>
</html>
