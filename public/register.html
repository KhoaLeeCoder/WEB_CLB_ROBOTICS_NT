<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tham gia CLB Robotics NT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap');
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-dark': '#0D47A1', 
                        'secondary-cyan': '#00BCD4', 
                        'background-light': '#F4F7FA',
                        'border-light': '#E0E0E0', 
                    },
                    fontFamily: {
                        'heading': ['Montserrat', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    },
                    borderRadius: {
                        'lg': '8px',
                    },
                    boxShadow: {
                        'custom': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06)',
                    }
                }
            }
        }
    </script>
</head>
<body class="font-body bg-background-light text-gray-800 flex items-center justify-center min-h-screen py-10">

    <div class="w-full max-w-xl p-4 sm:p-8">
        <div id="success-toast" class="hidden fixed top-5 right-5 z-50 p-4 bg-green-100 border-l-4 border-green-500 text-green-700 rounded-lg shadow-lg" role="alert">
            <p class="font-bold">Gửi đơn thành công!</p>
            <p class="text-sm">Đơn đăng ký của bạn đã được ghi nhận. CLB sẽ phản hồi sớm.</p>
        </div>

        <div class="bg-white p-8 md:p-10 rounded-lg shadow-custom border border-border-light">
            
            <div class="text-center mb-8">
                <svg class="h-10 w-10 text-secondary-cyan mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
                <h1 class="text-3xl font-heading font-extrabold text-primary-dark">Đăng ký tham gia CLB</h1>
                <p class="text-gray-500 mt-1">Vui lòng điền thông tin chi tiết để chúng tôi xét duyệt.</p>
            </div>

            <form id="registration-form" action="/api/register" method="POST">
                
                <div class="mb-4">
                    <label for="full_name" class="block text-sm font-medium text-gray-700">Họ và tên</label>
                    <input type="text" id="name" name="name" required 
                           class="mt-1 block w-full px-3 py-2 border border-border-light rounded-lg shadow-sm focus:ring-secondary-cyan focus:border-secondary-cyan sm:text-sm">
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label for="class" class="block text-sm font-medium text-gray-700">Lớp</label>
                        <input type="text" id="class" name="class" required 
                               class="mt-1 block w-full px-3 py-2 border border-border-light rounded-lg shadow-sm focus:ring-secondary-cyan focus:border-secondary-cyan sm:text-sm"
                               placeholder="Ví dụ: 10A1, 11D3">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="email" name="email" required 
                               class="mt-1 block w-full px-3 py-2 border border-border-light rounded-lg shadow-sm focus:ring-secondary-cyan focus:border-secondary-cyan sm:text-sm"
                               placeholder="VD: tenhocsinh@gmail.com">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="phone" class="block text-sm font-medium text-gray-700">Số điện thoại (Tùy chọn)</label>
                    <input type="tel" id="phone" name="phone"
                           class="mt-1 block w-full px-3 py-2 border border-border-light rounded-lg shadow-sm focus:ring-secondary-cyan focus:border-secondary-cyan sm:text-sm">
                </div>
                
                <div class="mb-6">
                    <label for="reason" class="block text-sm font-medium text-gray-700">Lý do muốn tham gia CLB?</label>
                    <textarea id="reason" name="reason" rows="3" required
                              class="mt-1 block w-full px-3 py-2 border border-border-light rounded-lg shadow-sm focus:ring-secondary-cyan focus:border-secondary-cyan sm:text-sm"
                              placeholder="Bạn mong muốn học hỏi và đóng góp gì?"></textarea>
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Lĩnh vực quan tâm (Có thể chọn nhiều)</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="fields" value="Robotics/Cơ khí" class="form-checkbox text-primary-dark rounded-md focus:ring-secondary-cyan h-4 w-4">
                            <span class="ml-2 text-sm text-gray-700">Robotics/Cơ khí</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="fields" value="Lập trình Nhúng (Arduino/STM32)" class="form-checkbox text-primary-dark rounded-md focus:ring-secondary-cyan h-4 w-4">
                            <span class="ml-2 text-sm text-gray-700">Lập trình Nhúng (Arduino/STM32)</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="fields" value="AI/Machine Learning" class="form-checkbox text-primary-dark rounded-md focus:ring-secondary-cyan h-4 w-4">
                            <span class="ml-2 text-sm text-gray-700">AI/Machine Learning</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="fields" value="Lập trình Web/Phần mềm" class="form-checkbox text-primary-dark rounded-md focus:ring-secondary-cyan h-4 w-4">
                            <span class="ml-2 text-sm text-gray-700">Lập trình Web/Phần mềm</span>
                        </label>
                    </div>
                </div>

                <button type="submit" 
                        class="w-full px-4 py-3 text-lg font-heading font-bold text-white rounded-lg shadow-lg 
                        bg-gradient-to-r from-secondary-cyan to-primary-dark 
                        hover:from-primary-dark hover:to-secondary-cyan transition duration-300 transform hover:scale-[1.01]">
                    Gửi Đơn Đăng ký
                </button>
            </form>

            <div class="mt-6 text-center text-sm">
                <a href="./login.html" class="font-medium text-primary-dark hover:text-secondary-cyan">Đã có tài khoản? Đăng nhập ngay</a>
                <p><a href="./index.html" class="font-medium text-primary-dark hover:text-secondary-cyan">Quay về trang chủ</a></p>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('status') === 'success') {
                const toast = document.getElementById('success-toast');
                if (toast) {
                    toast.classList.remove('hidden');
                    // Xóa tham số status khỏi URL sau khi hiển thị (tùy chọn)
                    history.replaceState(null, '', window.location.pathname);
                    
                    setTimeout(() => {
                        toast.classList.add('hidden');
                    }, 5000); // Ẩn toast sau 5 giây
                }
            }
        });
    </script>
</body>
</html>
